---
name: Remove the V12 fixes release
# One-off cleanup, removed again in the next commit: deletes the July "v12-fixes-1" release
# and its tag. The tag only marks a commit of upstream main; the fixes stay on their branches.
on:
  push:
    branches:
      - 'fast-lua-20ms'
    paths:
      - '.github/workflows/remove_v12_fixes_release.yml'

permissions:
  contents: write

jobs:
  remove:
    name: Delete v12-fixes-1
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        run: gh release delete v12-fixes-1 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
